name: Collect FFmpeg Corresponding Sources

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pinned BtbN FFmpeg-Builds
        uses: actions/checkout@v7
        with:
          repository: BtbN/FFmpeg-Builds
          ref: 590a6612d7d961e9258429e501619e0b7d7cbedf
          path: FFmpeg-Builds

      - name: Verify BtbN commit
        working-directory: FFmpeg-Builds
        run: |
          test "$(git rev-parse HEAD)" = "590a6612d7d961e9258429e501619e0b7d7cbedf"
          git rev-parse HEAD

      - name: Download dependency sources
        working-directory: FFmpeg-Builds
        env:
          GITHUB_REPOSITORY: BtbN/FFmpeg-Builds
        run: ./download.sh

      - name: Checkout corresponding FFmpeg source
        uses: actions/checkout@v7
        with:
          repository: FFmpeg/FFmpeg
          ref: 7c533d0f86
          path: FFmpeg-source
          fetch-depth: 1

      - name: Record provenance
        run: |
          cat > SOURCE_INFO.txt <<'EOF'
          MlabMovieCompressor v0.1.0 FFmpeg corresponding source bundle

          Bundled binary:
          ffmpeg version n8.1.2-44-g7c533d0f86-20260815

          BtbN FFmpeg-Builds:
          commit: 590a6612d7d961e9258429e501619e0b7d7cbedf
          target: win64
          variant: gpl
          addin: 8.1

          FFmpeg:
          commit: 7c533d0f86
          branch used by BtbN build definition: release/8.1

          Dependency source archives:
          generated by BtbN FFmpeg-Builds download.sh
          EOF

          echo >> SOURCE_INFO.txt
          echo "Resolved FFmpeg commit:" >> SOURCE_INFO.txt
          git -C FFmpeg-source rev-parse HEAD >> SOURCE_INFO.txt

          echo >> SOURCE_INFO.txt
          echo "Resolved BtbN commit:" >> SOURCE_INFO.txt
          git -C FFmpeg-Builds rev-parse HEAD >> SOURCE_INFO.txt

      - name: Remove Git metadata
        run: |
          rm -rf FFmpeg-Builds/.git
          rm -rf FFmpeg-source/.git

      - name: Create corresponding source archive
        run: |
          tar -czf ffmpeg-btbn-win64-gpl-8.1-corresponding-source.tar.gz \
            SOURCE_INFO.txt \
            FFmpeg-source \
            FFmpeg-Builds

      - name: Create SHA-256
        run: |
          sha256sum ffmpeg-btbn-win64-gpl-8.1-corresponding-source.tar.gz \
            > ffmpeg-btbn-win64-gpl-8.1-corresponding-source.tar.gz.sha256

      - name: Upload corresponding source artifact
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-btbn-win64-gpl-8.1-corresponding-source
          path: |
            ffmpeg-btbn-win64-gpl-8.1-corresponding-source.tar.gz
            ffmpeg-btbn-win64-gpl-8.1-corresponding-source.tar.gz.sha256
